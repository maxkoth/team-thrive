<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — TeamThrive</title>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060810;
      color: #eef0fb;
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Nav */
    .nav {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nav-logo {
      font-family: 'Clash Display', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav-logo span { color: #00e5a0; }
    .nav-back {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: #00e5a0; }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 52px 48px;
      width: 100%;
      max-width: 520px;
      backdrop-filter: blur(12px);
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #00e5a0;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .card-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 16px;
      color: #eef0fb;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #00e5a0;
      background: rgba(0,229,160,0.04);
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.2);
    }
    textarea {
      resize: vertical;
      min-height: 130px;
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      background: #00e5a0;
      color: #060810;
      border: none;
      border-radius: 10px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    /* Success message */
    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0 4px;
    }
    .success-msg .check {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .success-msg h2 {
      font-family: 'Clash Display', sans-serif;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .success-msg p {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
    }

    /* Footer */
    footer {
      padding: 20px 40px;
      border-top: 1px solid rgba(255,255,255,0.07);
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }

    @media (max-width: 560px) {
      .card { padding: 36px 24px; }
      .nav { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">TEAM<span>THRIVE</span></a>
  <a href="index.html" class="nav-back">← Back to home</a>
</nav>

<main>
  <div class="card">
    <div id="form-section">
      <p class="card-label">Get in touch</p>
      <h1 class="card-title">Contact Us</h1>
      <p class="card-sub">Have a question or need help? Fill out the form and we'll get back to you shortly.</p>

      <form id="contact-form" action="https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID" method="POST">
        <input type="hidden" name="_subject" value="New TeamThrive Contact Form Submission" />

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us how we can help..." required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

    <div class="success-msg" id="success-msg">
      <div class="check">✅</div>
      <h2>Message Sent!</h2>
      <p>Thanks for reaching out. We'll get back to you at your email shortly.</p>
    </div>
  </div>
</main>

<footer>© 2026 Team Thrive LLC. All rights reserved.</footer>

<script>
  const form = document.getElementById('contact-form');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = form.querySelector('.btn');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } else {
        btn.textContent = 'Failed — try again';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = 'Failed — try again';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
